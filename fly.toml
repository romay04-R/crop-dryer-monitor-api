# fly.toml app configuration file generated for crop-dryer-monitor-api on 2026-08-30T20:47:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'crop-dryer-monitor-api'
primary_region = 'fra'

[env]
  JAVA_VERSION = '17'
  SPRING_PROFILES_ACTIVE = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  interval = '15s'
  timeout = '10s'
  grace_period = '30s'
  method = 'GET'
  path = '/actuator/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
