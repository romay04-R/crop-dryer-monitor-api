# PostgreSQL profile (activate with: -Dspring.profiles.active=prod)
spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cropdryer}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

cropdryer:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://your-frontend-domain.com}
  api:
    key: ${API_KEY:}
  sms:
    enabled: ${SMS_ENABLED:false}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
      to-numbers: ${TWILIO_TO_NUMBERS:}
  rate-limit:
    enabled: true
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:10}
    refill-duration: ${RATE_LIMIT_REFILL_DURATION:1}
