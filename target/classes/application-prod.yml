# PostgreSQL profile (activate with: -Dspring.profiles.active=prod)
spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/cropdryer}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

cropdryer:
  cors:
    allowed-origins: ${CROPDRYER_CORS_ALLOWED_ORIGINS:https://your-frontend-domain.com}
  api:
    key: ${CROPDRYER_API_KEY:}
  sms:
    enabled: ${CROPDRYER_SMS_ENABLED:false}
    arkesel:
      api-key: ${CROPDRYER_SMS_ARKESEL_API_KEY:}
      sender-id: ${CROPDRYER_SMS_ARKESEL_SENDER_ID:CropDryer}
      to-numbers: ${CROPDRYER_SMS_ARKESEL_TO_NUMBERS:}
  rate-limit:
    enabled: true
    capacity: ${RATE_LIMIT_CAPACITY:100}
    refill-tokens: ${RATE_LIMIT_REFILL_TOKENS:10}
    refill-duration: ${RATE_LIMIT_REFILL_DURATION:1}
